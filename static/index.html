<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valuador de acciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Valuador de acciones</h1>
      <p>Ingresá un ticker y compará el precio de mercado con su valor intrínseco.</p>
    </header>

    <form id="form" autocomplete="off">
      <div class="row">
        <input id="ticker" name="ticker" type="text" placeholder="Ticker, por ejemplo AAPL" maxlength="12" required aria-label="Ticker de la acción">
        <button id="btn" type="submit">Calcular</button>
      </div>

      <!-- Reemplaza el fieldset de supuestos por este -->
      <fieldset class="supuestos">
        <legend>Supuestos del DCF</legend>
        <label class="field editable" data-tip="Crecimiento anual que esperás para el flujo de caja libre durante los años proyectados.">
          <span>Crecimiento anual (%)</span>
          <input id="growth" name="growth" type="number" step="any" min="-50" max="100" required>
        </label>
        <label class="field editable" data-tip="Rendimiento anual que exigís a la inversión. Suele usarse entre 8% y 12%.">
          <span>Tasa de descuento (%)</span>
          <input id="discount" name="discount" type="number" step="any" min="0.1" max="50" value="10" required>
        </label>
        <label class="field editable" data-tip="Crecimiento perpetuo del flujo de caja. No debe superar el crecimiento de la economía (2% a 3%).">
          <span>Crecimiento terminal (%)</span>
          <input id="terminal" name="terminal" type="number" step="any" min="-5" max="10" value="2.5" required>
        </label>
        <label class="field editable" data-tip="Cantidad de años en los que se proyecta el flujo de caja.">
          <span>Años de proyección</span>
          <input id="years" name="years" type="number" step="1" min="1" max="30" value="10" required>
        </label>
      </fieldset>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="resultado" hidden>
      <h2 id="empresa"></h2>

      <div class="hero">
        <label class="field big" data-tip="Última cotización de la acción.">
          <span>Precio actual</span>
          <input id="precio" readonly>
        </label>
        <label class="field big" data-tip="Estimación de lo que vale la acción según el modelo DCF.">
          <span>Valor intrínseco</span>
          <input id="valor_intrinseco" readonly>
        </label>
        <label class="field big pos-neg" id="f-diferencia" data-tip="Diferencia nominal entre el valor intrínseco y el precio actual.">
          <span>Diferencia ($)</span>
          <input id="diferencia" readonly>
        </label>
        <label class="field big pos-neg" id="f-diferencia-pct" data-tip="Diferencia porcentual respecto al precio actual.">
          <span>Diferencia (%)</span>
          <input id="diferencia_pct" readonly>
        </label>
      </div>

      <div class="grid">
        <label class="field" data-tip="Earnings per share: ganancia neta dividida por acciones.">
          <span>EPS</span><input id="eps" readonly>
        </label>
        <label class="field" data-tip="Price/Earnings: precio dividido por EPS.">
          <span>PER</span><input id="per" readonly>
        </label>
        <label class="field" data-tip="PER dividido por el crecimiento esperado.">
          <span>PEG</span><input id="peg" readonly>
        </label>
        <label class="field" data-tip="Return on Invested Capital: rentabilidad sobre el capital invertido.">
          <span>ROIC</span><input id="roic" readonly>
        </label>
        <label class="field" data-tip="Enterprise Value: valor de la empresa asumiendo su deuda neta.">
          <span>EV</span><input id="ev" readonly>
        </label>
        <label class="field" data-tip="Free Cash Flow (Valor por acción).">
          <span>FCF</span><input id="fcf" readonly>
        </label>
        <label class="field" data-tip="Earnings Before Interest and Taxes.">
          <span>EBIT</span><input id="ebit" readonly>
        </label>
        <label class="field" data-tip="Enterprise Value dividido por FCF.">
          <span>EV/FCF</span><input id="ev_fcf" readonly>
        </label>
        <label class="field" data-tip="Enterprise Value dividido por EBIT.">
          <span>EV/EBIT</span><input id="ev_ebit" readonly>
        </label>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
